<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文案提取器 - AI Powered Transcript Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#FEF2F4',
                            100: '#FEE2E6',
                            200: '#FECAD3',
                            300: '#FDA8AF',
                            400: '#FB7185',
                            500: '#F43F5E',
                            600: '#E11D48',
                            700: '#BE123C',
                            800: '#9F1239',
                            900: '#881337',
                        },
                        accent: {
                            50: '#EFF6FF',
                            100: '#DBEAFE',
                            200: '#BFDBFE',
                            300: '#93C5FD',
                            400: '#60A5FA',
                            500: '#3B82F6',
                            600: '#2563EB',
                            700: '#1D4ED8',
                            800: '#1E40AF',
                            900: '#1E3A8A',
                        },
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-1000px 0' },
                            '100%': { backgroundPosition: '1000px 0' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'gradient-mesh': 'conic-gradient(from 0deg at 50% 50%, #F43F5E 0deg, #3B82F6 90deg, #8B5CF6 180deg, #F43F5E 270deg, #F43F5E 360deg)',
                    },
                },
            },
        }
    </script>
    <style>
        /* Base Styles */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-dark {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        /* Animated Background */
        .animated-bg {
            background: linear-gradient(-45deg, #EEF2FF, #FEF2F4, #F0F9FF, #FAF5FF);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            pointer-events: none;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
            top: -100px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #3B82F6 0%, #60A5FA 100%);
            bottom: -50px;
            left: -50px;
            animation: float 10s ease-in-out infinite 2s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%);
            top: 50%;
            left: 50%;
            animation: float 12s ease-in-out infinite 4s;
        }

        /* Gradient Button */
        .btn-gradient {
            background: linear-gradient(135deg, #F43F5E 0%, #E11D48 50%, #BE123C 100%);
            background-size: 200% 200%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-gradient:hover::before {
            left: 100%;
        }

        .btn-gradient:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.4);
        }

        .btn-gradient:active {
            transform: translateY(0);
        }

        /* Focus Ring */
        .focus-ring:focus {
            outline: none;
            ring: 2px;
            ring-color: #3B82F6;
            ring-offset: 2px;
        }

        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #F43F5E 0%, #3B82F6 100%);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #E11D48 0%, #2563EB 100%);
        }

        /* Shimmer Loading Effect */
        .shimmer {
            background: linear-gradient(90deg, #F0F0F0 25%, #E8E8E8 50%, #F0F0F0 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Text Gradient */
        .text-gradient {
            background: linear-gradient(135deg, #F43F5E 0%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Status Indicator Pulse */
        .status-pulse {
            position: relative;
        }

        .status-pulse::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            animation: pulse-ring 2s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        /* Input Focus Effect */
        .input-focus-effect {
            transition: all 0.3s ease;
        }

        .input-focus-effect:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="animated-bg min-h-screen relative overflow-x-hidden" x-data="douyinExtractor()">

    <!-- Floating Orbs Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Top Navigation Bar -->
    <nav class="sticky top-4 z-50 mx-4 sm:mx-6 lg:mx-8">
        <div class="glass rounded-2xl shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <!-- Logo -->
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-brand-500 to-brand-600 rounded-xl flex items-center justify-center shadow-lg shadow-brand-500/30">
                            <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-slate-800">文案提取器</h1>
                            <p class="text-xs text-slate-500 -mt-0.5 font-medium">AI Transcript Extractor</p>
                        </div>
                    </div>

                    <!-- API Status Badge -->
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium"
                             :class="apiKeyConfigured ? 'bg-emerald-50 text-emerald-700' : 'bg-emerald-50 text-emerald-700'">
                            <span class="relative flex h-2.5 w-2.5">
                                <span class="absolute inline-flex h-full w-full rounded-full opacity-75 status-pulse bg-emerald-500"></span>
                                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                            </span>
                            <span>API 已配置</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pt-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- Left Panel - Input -->
            <div class="lg:col-span-5 space-y-6">

                <!-- Input Card -->
                <div class="glass-card rounded-3xl p-6">
                    <div class="mb-5">
                        <label class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-3">
                            <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                            </svg>
                            分享链接
                        </label>
                        <div class="relative">
                            <textarea
                                x-model="url"
                                @keydown.meta.enter="extractText"
                                @keydown.ctrl.enter="extractText"
                                placeholder="粘贴分享链接或文本，例如：&#10;7.89 02/February/2025 xxx https://v.douyin.com/xxxxx/"
                                rows="5"
                                class="w-full px-5 py-4 text-sm border-2 border-slate-200 rounded-2xl resize-none input-focus-effect bg-white/50 placeholder:text-slate-400"
                                :disabled="loading"
                            ></textarea>
                            <button
                                x-show="url"
                                @click="url = ''; resetState()"
                                class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center transition-all duration-200 hover:scale-110">
                                <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                        <p class="mt-3 text-xs text-slate-500 flex items-center gap-2">
                            <kbd class="px-2 py-1 bg-slate-200 rounded-lg text-slate-700 font-mono text-xs">⌘</kbd>
                            <span>+</span>
                            <kbd class="px-2 py-1 bg-slate-200 rounded-lg text-slate-700 font-mono text-xs">Enter</kbd>
                            <span>快速提取</span>
                        </p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-3">
                        <button
                            @click="extractInfo"
                            :disabled="!url || loading"
                            class="flex-1 h-12 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm rounded-2xl transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 hover:scale-105 disabled:hover:scale-100">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            获取信息
                        </button>
                        <button
                            @click="extractText"
                            :disabled="!url || loading"
                            class="flex-1 h-12 btn-gradient text-white font-bold text-sm rounded-2xl disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 disabled:hover:scale-100 disabled:shadow-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            提取文案
                        </button>
                    </div>
                </div>

                <!-- Video Info Card -->
                <div x-show="videoInfo" x-transition:enter="transition ease-out duration-300"
                     x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
                     class="glass-card glass-card-hover rounded-3xl overflow-hidden"
                     style="display: none;">

                    <!-- Card Header -->
                    <div class="px-6 py-5 border-b border-slate-100/50 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 bg-gradient-to-br from-brand-500 to-brand-600 rounded-2xl flex items-center justify-center shadow-lg shadow-brand-500/30">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                </svg>
                            </div>
                            <span class="font-bold text-slate-800">视频信息</span>
                        </div>
                        <span class="text-xs text-slate-400 font-mono px-3 py-1.5 bg-slate-100 rounded-xl" x-text="videoInfo?.video_id"></span>
                    </div>

                    <!-- Card Body -->
                    <div class="p-6">
                        <div class="flex items-start gap-2 mb-5 group">
                            <h3 class="font-bold text-slate-800 flex-1 text-base" x-text="videoInfo?.title"></h3>
                            <button @click="copyToClipboard(videoInfo?.title)"
                                    class="opacity-0 group-hover:opacity-100 w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center flex-shrink-0 transition-all duration-200 hover:scale-110">
                                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                </svg>
                            </button>
                        </div>

                        <!-- Info Items -->
                        <div class="space-y-3">
                            <div class="flex items-center gap-4 p-4 bg-gradient-to-r from-slate-50 to-slate-100/50 rounded-2xl group hover:from-slate-100 hover:to-slate-150 transition-all duration-200 cursor-pointer">
                                <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                                    <svg class="w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
                                    </svg>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs text-slate-400 mb-0.5 font-medium">视频 ID</p>
                                    <p class="text-sm font-mono text-slate-700 truncate font-semibold" x-text="videoInfo?.video_id"></p>
                                </div>
                                <button @click="copyToClipboard(videoInfo?.video_id)"
                                        class="opacity-0 group-hover:opacity-100 w-10 h-10 rounded-xl bg-white hover:bg-slate-100 flex items-center justify-center transition-all duration-200 hover:scale-110 shadow-sm">
                                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                    </svg>
                                </button>
                            </div>

                            <a x-show="videoInfo?.download_url"
                               :href="`/api/video/download?url=${encodeURIComponent(videoInfo?.download_url)}&filename=${encodeURIComponent(videoInfo?.video_id || 'video')}.mp4`"
                               class="flex items-center gap-4 p-4 bg-gradient-to-r from-emerald-50 to-emerald-100/50 rounded-2xl group hover:from-emerald-100 hover:to-emerald-150 transition-all duration-200 cursor-pointer hover:scale-[1.02]">
                                <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                                    <svg class="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                    </svg>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs text-emerald-600 mb-0.5 font-medium">无水印视频</p>
                                    <p class="text-sm font-bold text-emerald-700">点击下载原视频</p>
                                </div>
                                <svg class="w-6 h-6 text-emerald-500 group-hover:translate-x-1 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Loading State -->
                <div x-show="loading" x-transition class="glass-card rounded-3xl p-6"
                     style="display: none;">
                    <div class="flex items-center gap-5 mb-6">
                        <div class="relative w-16 h-16">
                            <div class="absolute inset-0 rounded-full border-4 border-slate-100"></div>
                            <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-brand-500 animate-spin"></div>
                        </div>
                        <div>
                            <p class="font-bold text-slate-800 text-lg" x-text="loadingText"></p>
                            <p class="text-sm text-slate-500">请稍候...</p>
                        </div>
                    </div>

                    <!-- Progress Steps -->
                    <div x-show="extractingText" class="space-y-3">
                        <template x-for="(stepItem, index) in steps" :key="index">
                            <div class="flex items-center gap-4 p-4 rounded-2xl transition-all duration-300"
                                 :class="step > index + 1 ? 'bg-emerald-50' : step === index + 1 ? 'bg-brand-50' : 'bg-slate-50'">
                                <div class="w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold transition-all duration-300"
                                     :class="step > index + 1 ? 'bg-emerald-500 text-white' : step === index + 1 ? 'bg-brand-500 text-white' : 'bg-slate-200 text-slate-500'">
                                    <svg x-show="step > index + 1" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                    </svg>
                                    <span x-show="step <= index + 1" x-text="index + 1"></span>
                                </div>
                                <span class="text-sm font-medium" :class="step >= index + 1 ? 'text-slate-800' : 'text-slate-400'" x-text="stepItem"></span>
                                <div x-show="step === index + 1" class="ml-auto w-2 h-2 rounded-full bg-brand-500 animate-ping"></div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Error State -->
                <div x-show="error" x-transition class="bg-gradient-to-r from-red-50 to-red-100/50 border-2 border-red-200 rounded-3xl p-6"
                     style="display: none;">
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 bg-red-100 rounded-2xl flex items-center justify-center flex-shrink-0">
                            <svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 20 20">

    <script>
        function douyinExtractor() {
            return {
                url: '',
                loading: false,
                loadingText: '',
                extractingText: false,
                step: 0,
                steps: ['解析分享链接', '下载视频', '提取音频', '识别语音'],
                error: '',
                videoInfo: null,
                transcript: '',
                copied: false,
                toast: '',
                showHelp: false,
                serverApiKeyConfigured: false,

                get apiKeyConfigured() {
                    return this.serverApiKeyConfigured;
                },

                async checkHealth() {
                    try {
                        const res = await fetch('/api/health');
                        const data = await res.json();
                        this.serverApiKeyConfigured = data.api_key_configured;
                    } catch (e) {
                        console.error('Health check failed:', e);
                    }
                },

                resetState() {
                    this.error = '';
                    this.videoInfo = null;
                    this.transcript = '';
                    this.step = 0;
                    this.extractingText = false;
                },

                showToast(message) {
                    this.toast = message;
                    setTimeout(() => this.toast = '', 2500);
                },

                async copyToClipboard(text) {
                    try {
                        await navigator.clipboard.writeText(text);
                        this.showToast('已复制到剪贴板');
                    } catch (e) {
                        this.error = '复制失败';
                    }
                },

                async extractInfo() {
                    if (!this.url || this.loading) return;

                    this.resetState();
                    this.loading = true;
                    this.loadingText = '正在获取视频信息...';

                    try {
                        const res = await fetch('/api/video/info', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: this.url })
                        });
                        const data = await res.json();

                        if (data.success) {
                            this.videoInfo = data;
                            this.showToast('视频信息获取成功');
                        } else {
                            this.error = data.error || '获取视频信息失败';
                        }
                    } catch (e) {
                        this.error = '网络错误，请检查网络连接后重试';
                    } finally {
                        this.loading = false;
                    }
                },

                async extractText() {
                    if (!this.url || this.loading) return;

                    this.resetState();
                    this.loading = true;
                    this.extractingText = true;
                    this.loadingText = '正在提取文案...';

                    // Simulate progress steps
                    this.step = 1;
                    const stepInterval = setInterval(() => {
                        if (this.step < 4) this.step++;
                    }, 2500);

                    try {
                        const res = await fetch('/api/video/extract', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                url: this.url
                            })
                        });
                        const data = await res.json();

                        clearInterval(stepInterval);
                        this.step = 5;

                        if (data.success) {
                            this.videoInfo = {
                                video_id: data.video_id,
                                title: data.title,
                                download_url: data.download_url
                            };
                            this.transcript = data.text;
                            this.showToast('文案提取成功');
                        } else {
                            this.error = data.error || '提取文案失败';
                        }
                    } catch (e) {
                        clearInterval(stepInterval);
                        this.error = '网络错误，请检查网络连接后重试';
                    } finally {
                        this.loading = false;
                    }
                },

                async copyTranscript() {
                    // Method 1: Try modern Clipboard API first
                    if (navigator.clipboard && window.isSecureContext) {
                        try {
                            await navigator.clipboard.writeText(this.transcript);
                            this.copied = true;
                            this.showToast('文案已复制到剪贴板');
                            setTimeout(() => this.copied = false, 2000);
                            return;
                        } catch (e) {
                            console.warn('Clipboard API failed, trying fallback:', e);
                        }
                    }

                    // Method 2: Fallback to execCommand
                    try {
                        const textarea = document.createElement('textarea');
                        textarea.value = this.transcript;
                        textarea.style.position = 'fixed';
                        textarea.style.opacity = '0';
                        document.body.appendChild(textarea);
                        textarea.select();

                        const successful = document.execCommand('copy');
                        document.body.removeChild(textarea);

                        if (successful) {
                            this.copied = true;
                            this.showToast('文案已复制到剪贴板');
                            setTimeout(() => this.copied = false, 2000);
                        } else {
                            throw new Error('execCommand failed');
                        }
                    } catch (e) {
                        console.error('Copy failed:', e);
                        this.showToast('复制失败，请手动选择文本复制');
                    }
                },

                downloadTranscript() {
                    const content = `# ${this.videoInfo?.title || '视频文案'}\n\n视频ID: ${this.videoInfo?.video_id || ''}\n\n---\n\n${this.transcript}`;
                    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${this.videoInfo?.video_id || 'transcript'}.md`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    this.showToast('文案已下载');
                }
            }
        }
    </script>
